name: build addon

on:
  push:
    branches: [ main, master ]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in buildVars.py (creates its v tag)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install build tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gettext
        python -m pip install scons==4.10.1 Markdown==3.10 ruff==0.14.5

    - name: Lint
      run: ruff check .

    - name: Unit tests
      run: python -m unittest discover tests -v

    - name: Build add-on
      run: scons && scons pot

    - uses: actions/upload-artifact@v4
      with:
        name: packaged_addon
        path: ./*.nvda-addon

  release:
    # Runs for tags such as v1.3.0, or when started by hand with "publish":
    # publishes a GitHub release with the add-on attached.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: packaged_addon
        path: dist

    - name: Prepare release files and notes
      id: prepare
      run: |
        version="$(sed -n 's/^[[:space:]]*addon_version="\(.*\)",$/\1/p' buildVars.py)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        versioned="dist/cliHelper-${version}.nvda-addon"
        test -f "$versioned"
        # A copy with a fixed name, so https://github.com/<repo>/releases/latest/download/cliHelper.nvda-addon
        # always downloads the newest version.
        cp "$versioned" dist/cliHelper.nvda-addon
        # Release notes: this version's section of changelog.md, plus the checksum.
        awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found {print}' changelog.md > notes.md
        {
          echo
          echo "## Download"
          echo
          echo "Download **cliHelper-${version}.nvda-addon** below, open it, and NVDA asks to install it."
          echo
          echo "SHA256: \`$(sha256sum "$versioned" | cut -d' ' -f1)\`"
        } >> notes.md

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        name: CLI Helper ${{ steps.prepare.outputs.version }}
        tag_name: v${{ steps.prepare.outputs.version }}
        target_commitish: ${{ github.sha }}
        body_path: notes.md
        files: |
          dist/cliHelper-*.nvda-addon
          dist/cliHelper.nvda-addon
