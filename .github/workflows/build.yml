name: build addon

on:
  push:
    branches: [ main, master ]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install build tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y gettext
        python -m pip install scons==4.10.1 Markdown==3.10 ruff==0.14.5

    - name: Lint
      run: ruff check .

    - name: Unit tests
      run: python -m unittest discover tests -v

    - name: Build add-on
      run: scons && scons pot

    - uses: actions/upload-artifact@v4
      with:
        name: packaged_addon
        path: ./*.nvda-addon

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: packaged_addon
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: "*.nvda-addon"
